<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<title>家計簿</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23F2F4EC'/%3E%3Ccircle cx='50' cy='50' r='34' fill='none' stroke='%23C1432B' stroke-width='5'/%3E%3Ctext x='50' y='60' font-size='30' text-anchor='middle' fill='%23C1432B' font-family='serif'%3E家%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F2F4EC;
    --paper-line:#DADDC8;
    --ink:#202A3D;
    --ink-soft:#66707D;
    --card:#FFFFFF;
    --card-border:#E1E4D3;
    --stamp-red:#C1432B;
    --stamp-red-soft:#F4E2DC;
    --stamp-green:#2E6B4E;
    --stamp-green-soft:#DEEAE2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--paper-line) 0 1px, transparent 1px 28px),
      repeating-linear-gradient(90deg, var(--paper-line) 0 1px, transparent 1px 28px);
    background-position:-1px -1px;
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  .wrap{max-width:520px;margin:0 auto;padding:18px 16px 8px;}

  /* header */
  .month-nav{
    display:flex;align-items:center;justify-content:center;gap:18px;
    padding:6px 0 14px;
  }
  .month-nav button{
    background:none;border:none;font-size:22px;color:var(--ink-soft);
    cursor:pointer;padding:4px 10px;line-height:1;
    transition:color .15s;
  }
  .month-nav button:hover{color:var(--ink);}
  .month-nav .label{
    font-family:'Shippori Mincho', serif;
    font-weight:700;font-size:22px;letter-spacing:.04em;
    min-width:150px;text-align:center;
  }
  .today-btn{
    display:inline-block;font-size:12px;color:var(--ink-soft);
    background:none;border:1px solid var(--card-border);border-radius:20px;
    padding:3px 12px;cursor:pointer;font-family:inherit;
  }
  .util-row{
    display:flex;justify-content:center;gap:8px;margin:-8px 0 14px;
  }

  /* summary card */
  .summary{
    background:var(--card);
    border:1px solid var(--card-border);
    border-radius:6px;
    padding:20px 20px 24px;
    box-shadow:0 1px 0 rgba(32,42,61,.03);
    position:relative;
  }
  .row-line{
    display:flex;justify-content:space-between;align-items:baseline;
    padding:7px 0;
    border-bottom:1px dashed var(--card-border);
  }
  .row-line:last-of-type{border-bottom:none;}
  .row-line .k{font-size:13px;color:var(--ink-soft);letter-spacing:.03em;}
  .row-line .v{font-family:'Shippori Mincho',serif;font-weight:700;font-size:19px;}
  .budget-edit{
    display:flex;align-items:baseline;gap:4px;
  }
  .budget-edit input{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:19px;
    border:none;border-bottom:1px solid var(--card-border);
    background:transparent;color:var(--ink);width:120px;text-align:right;
    padding:2px 0;
  }
  .budget-edit input:focus{outline:none;border-color:var(--stamp-green);}
  .yen{font-size:13px;color:var(--ink-soft);}

  .gauge-track{
    margin-top:14px;height:9px;border-radius:5px;background:var(--paper);
    border:1px solid var(--card-border);overflow:hidden;
  }
  .gauge-fill{height:100%;background:var(--stamp-green);transition:width .35s ease;}
  .gauge-fill.over{background:var(--stamp-red);}
  .gauge-pct{margin-top:6px;font-size:11px;color:var(--ink-soft);text-align:right;}

  /* stamp */
  .stamp-zone{display:flex;justify-content:center;padding:22px 0 4px;}
  .stamp{
    width:128px;height:128px;border-radius:50%;
    border:3px solid var(--stamp-green);color:var(--stamp-green);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    transform:rotate(-7deg);
    font-family:'Shippori Mincho',serif;
    position:relative;
    background:
      radial-gradient(circle at 30% 30%, rgba(46,107,78,.06), transparent 60%);
  }
  .stamp::before{
    content:"";position:absolute;inset:6px;border:1px solid currentColor;
    border-radius:50%;opacity:.5;
  }
  .stamp.over{border-color:var(--stamp-red);color:var(--stamp-red);
    background:radial-gradient(circle at 30% 30%, rgba(193,67,43,.07), transparent 60%);}
  .stamp .cap{font-size:11px;letter-spacing:.25em;margin-bottom:2px;}
  .stamp .amt{font-size:20px;font-weight:800;letter-spacing:.01em;}
  .stamp .sub{font-size:9px;letter-spacing:.15em;margin-top:2px;opacity:.85;}

  /* list */
  .section-title{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;
    margin:26px 4px 10px;letter-spacing:.05em;color:var(--ink);
    display:flex;align-items:center;gap:8px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--card-border);}

  .entry{
    background:var(--card);border:1px solid var(--card-border);border-radius:6px;
    padding:12px 14px;margin-bottom:8px;
    display:flex;align-items:center;gap:12px;
  }
  .entry .date{
    font-family:'Shippori Mincho',serif;font-size:13px;color:var(--ink-soft);
    width:40px;flex-shrink:0;line-height:1.25;text-align:center;
  }
  .entry .date b{display:block;font-size:16px;color:var(--ink);font-weight:700;}
  .entry .mid{flex:1;min-width:0;}
  .entry .item{font-size:14px;font-weight:500;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .pay{
    display:inline-block;margin-top:3px;font-size:10.5px;color:var(--ink-soft);
    border:1px solid var(--card-border);border-radius:10px;padding:1px 8px;
  }
  .entry .amount{
    font-family:'Shippori Mincho',serif;font-weight:700;font-size:15px;
    white-space:nowrap;
  }
  .entry .del{
    background:none;border:none;color:var(--card-border);font-size:16px;
    cursor:pointer;padding:2px 2px 2px 6px;flex-shrink:0;
  }
  .entry .del:hover{color:var(--stamp-red);}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:13px;
    padding:36px 10px;border:1px dashed var(--card-border);border-radius:6px;
    background:rgba(255,255,255,.4);
  }

  /* fab */
  .fab{
    position:fixed;right:20px;bottom:28px;
    width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    border:none;font-size:26px;line-height:1;cursor:pointer;
    box-shadow:0 6px 16px rgba(32,42,61,.28);
    display:flex;align-items:center;justify-content:center;
  }
  .fab:active{transform:scale(.94);}

  /* sheet */
  .overlay{
    position:fixed;inset:0;background:rgba(32,42,61,.35);
    display:none;align-items:flex-end;justify-content:center;z-index:20;
  }
  .overlay.show{display:flex;}
  .sheet{
    background:var(--paper);width:100%;max-width:520px;
    border-radius:16px 16px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));
    border-top:1px solid var(--card-border);
    animation:up .22s ease;
  }
  @keyframes up{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet h3{
    font-family:'Shippori Mincho',serif;margin:2px 0 16px;font-size:17px;font-weight:700;
  }
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;letter-spacing:.03em;}
  .field input, .field select{
    width:100%;padding:10px 12px;border:1px solid var(--card-border);
    border-radius:6px;background:var(--card);font-size:15px;color:var(--ink);
    font-family:inherit;
  }
  .field input:focus, .field select:focus{outline:none;border-color:var(--stamp-green);}
  .sheet-actions{display:flex;gap:10px;margin-top:6px;}
  .sheet-actions button{
    flex:1;padding:12px;border-radius:6px;border:1px solid var(--card-border);
    font-size:14px;font-family:inherit;cursor:pointer;
  }
  .btn-cancel{background:transparent;color:var(--ink-soft);}
  .btn-add{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700;}
  .btn-add:disabled{opacity:.4;}

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:var(--paper);font-size:12.5px;
    padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;
    transition:opacity .25s;z-index:30;
  }
  .toast.show{opacity:1;}

  .loading{text-align:center;padding:60px 0;color:var(--ink-soft);font-size:13px;}

  .pay-row{
    display:flex;align-items:center;justify-content:space-between;
    background:var(--card);border:1px solid var(--card-border);border-radius:6px;
    padding:9px 12px;margin-bottom:7px;font-size:14px;
  }
  .pay-row button{
    background:none;border:none;color:var(--card-border);font-size:15px;cursor:pointer;
  }
  .pay-row button:hover{color:var(--stamp-red);}
  .pay-add-row{display:flex;gap:8px;margin-top:4px;margin-bottom:16px;}
  .pay-add-row input{flex:1;}
  .pay-add-row button{
    padding:0 16px;border-radius:6px;border:1px solid var(--card-border);
    background:var(--ink);color:var(--paper);font-size:13px;cursor:pointer;
  }
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading" id="loading">読み込み中…</div>
</div>

<button class="fab" id="fabBtn" style="display:none">＋</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h3>支出を追加</h3>
    <div class="field">
      <label>日付</label>
      <input type="date" id="inDate">
    </div>
    <div class="field">
      <label>項目</label>
      <input type="text" id="inItem" placeholder="例）スーパーで食材" maxlength="40">
    </div>
    <div class="field">
      <label>金額（円）</label>
      <input type="number" id="inAmount" placeholder="0" min="0" inputmode="numeric">
    </div>
    <div class="field">
      <label>支払い方法</label>
      <select id="inPay">
        <option>現金</option>
        <option>クレジットカード</option>
        <option>デビットカード</option>
        <option>電子マネー</option>
        <option>口座振替</option>
        <option>その他</option>
      </select>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="cancelBtn">キャンセル</button>
      <button class="btn-add" id="addBtn">追加する</button>
    </div>
  </div>
</div>

<div class="overlay" id="payOverlay">
  <div class="sheet">
    <h3>支払い方法を編集</h3>
    <div id="payList"></div>
    <div class="pay-add-row">
      <input type="text" id="newPayInput" placeholder="新しい支払い方法" maxlength="12">
      <button id="newPayAddBtn">追加</button>
    </div>
    <div class="sheet-actions">
      <button class="btn-cancel" id="payCloseBtn">閉じる</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){

  // Browser-safe storage adapter. window.storage is not a standard Web API,
  // so use it only when available, otherwise fall back to localStorage.
  const storage = (window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function')
    ? window.storage
    : {
        async get(key){
          const value = localStorage.getItem(key);
          return value === null ? null : { value };
        },
        async set(key, value){
          localStorage.setItem(key, String(value));
        }
      };
  const app = document.getElementById('app');
  const fabBtn = document.getElementById('fabBtn');
  const overlay = document.getElementById('overlay');
  const cancelBtn = document.getElementById('cancelBtn');
  const addBtn = document.getElementById('addBtn');
  const toastEl = document.getElementById('toast');

  function pad(n){ return n.toString().padStart(2,'0'); }
  function monthKey(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}`; }
  function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
  function yen(n){ return '¥' + Math.round(n).toLocaleString('ja-JP'); }

  let current = new Date();
  current.setDate(1);
  let budget = 0;
  let expenses = [];

  const DEFAULT_PAY = ['現金','クレジットカード','デビットカード','電子マネー','口座振替','その他'];
  let paymentMethods = [...DEFAULT_PAY];

  async function loadPaymentMethods(){
    try {
      const p = await storage.get('paymentMethods');
      const list = p ? JSON.parse(p.value) : null;
      paymentMethods = (Array.isArray(list) && list.length) ? list : [...DEFAULT_PAY];
    } catch(e){ paymentMethods = [...DEFAULT_PAY]; }
  }

  async function savePaymentMethods(){
    try { await storage.set('paymentMethods', JSON.stringify(paymentMethods), false); }
    catch(e){ showToast('保存に失敗しました'); }
  }

  function buildPaySelect(){
    const sel = document.getElementById('inPay');
    if (!sel) return;
    sel.innerHTML = paymentMethods.map(p=>`<option>${escapeHtml(p)}</option>`).join('');
  }

  function renderPayList(){
    const list = document.getElementById('payList');
    list.innerHTML = paymentMethods.map((p,i)=>`
      <div class="pay-row">
        <span>${escapeHtml(p)}</span>
        <button class="pay-del" data-i="${i}" aria-label="削除">✕</button>
      </div>
    `).join('');
    list.querySelectorAll('.pay-del').forEach(btn=>{
      btn.onclick = async ()=>{
        if (paymentMethods.length <= 1){
          showToast('最低1つは必要です');
          return;
        }
        const i = Number(btn.getAttribute('data-i'));
        paymentMethods.splice(i,1);
        await savePaymentMethods();
        renderPayList();
        buildPaySelect();
      };
    });
  }

  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=>toastEl.classList.remove('show'), 1600);
  }

  async function loadMonth(){
    const key = monthKey(current);
    try {
      const b = await storage.get(`budget:${key}`);
      budget = b ? Number(b.value) || 0 : 0;
    } catch(e){ budget = 0; }
    try {
      const ex = await storage.get(`expenses:${key}`);
      expenses = ex ? JSON.parse(ex.value) : [];
    } catch(e){ expenses = []; }
  }

  async function saveBudget(val){
    const key = monthKey(current);
    try {
      await storage.set(`budget:${key}`, String(val), false);
    } catch(e){ showToast('保存に失敗しました'); }
  }

  async function saveExpenses(){
    const key = monthKey(current);
    try {
      await storage.set(`expenses:${key}`, JSON.stringify(expenses), false);
    } catch(e){ showToast('保存に失敗しました'); }
  }

  function render(){
    const spent = expenses.reduce((s,e)=>s+Number(e.amount||0),0);
    const remain = budget - spent;
    const pct = budget > 0 ? Math.min(100, (spent/budget)*100) : 0;
    const over = remain < 0;

    const sorted = [...expenses].sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

    const monthLabel = `${current.getFullYear()}年 ${current.getMonth()+1}月`;

    app.innerHTML = `
      <div class="month-nav">
        <button id="prevBtn" aria-label="前の月">‹</button>
        <div class="label">${monthLabel}</div>
        <button id="nextBtn" aria-label="次の月">›</button>
      </div>
      <div class="util-row">
        <button class="today-btn" id="todayBtn">今月に戻る</button>
        <button class="today-btn" id="payKanriBtn">支払い方法を編集</button>
      </div>

      <div class="summary">
        <div class="row-line">
          <div class="k">予算</div>
          <div class="budget-edit">
            <span class="yen">¥</span>
            <input type="number" id="budgetInput" value="${budget}" min="0" inputmode="numeric">
          </div>
        </div>
        <div class="row-line">
          <div class="k">使った額</div>
          <div class="v">${yen(spent)}</div>
        </div>
        <div class="gauge-track"><div class="gauge-fill ${over?'over':''}" style="width:${pct}%"></div></div>
        <div class="gauge-pct">${budget>0 ? pct.toFixed(0)+'% 使用' : '予算を入力してください'}</div>
      </div>

      <div class="stamp-zone">
        <div class="stamp ${over?'over':''}">
          <div class="cap">${over ? '予算超過' : '残高'}</div>
          <div class="amt">${yen(Math.abs(remain))}</div>
          <div class="sub">${current.getMonth()+1}GATSU</div>
        </div>
      </div>

      <div class="section-title">支出一覧</div>
      <div id="list">
        ${sorted.length === 0 ? `<div class="empty">まだ支出がありません。右下の＋から追加できます。</div>` :
          sorted.map(e => `
            <div class="entry" data-id="${e.id}">
              <div class="date">${e.date.slice(5).replace('-','/')}</div>
              <div class="mid">
                <div class="item">${escapeHtml(e.item || '（項目なし）')}</div>
                <div class="pay">${escapeHtml(e.pay)}</div>
              </div>
              <div class="amount">${yen(e.amount)}</div>
              <button class="del" data-id="${e.id}" aria-label="削除">✕</button>
            </div>
          `).join('')
        }
      </div>
    `;

    document.getElementById('prevBtn').onclick = ()=>changeMonth(-1);
    document.getElementById('nextBtn').onclick = ()=>changeMonth(1);
    document.getElementById('todayBtn').onclick = ()=>goToday();
    document.getElementById('payKanriBtn').onclick = ()=>openPaySettings();

    const bi = document.getElementById('budgetInput');
    bi.addEventListener('change', async ()=>{
      const v = Math.max(0, Number(bi.value)||0);
      budget = v;
      await saveBudget(v);
      render();
    });

    document.querySelectorAll('.del').forEach(btn=>{
      btn.onclick = async ()=>{
        const id = btn.getAttribute('data-id');
        expenses = expenses.filter(e=>e.id !== id);
        await saveExpenses();
        render();
      };
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  async function changeMonth(delta){
    current.setMonth(current.getMonth()+delta);
    app.innerHTML = '<div class="loading">読み込み中…</div>';
    await loadMonth();
    render();
  }

  async function goToday(){
    current = new Date();
    current.setDate(1);
    app.innerHTML = '<div class="loading">読み込み中…</div>';
    await loadMonth();
    render();
  }

  function openSheet(){
    document.getElementById('inDate').value = todayStr();
    document.getElementById('inItem').value = '';
    document.getElementById('inAmount').value = '';
    buildPaySelect();
    overlay.classList.add('show');
  }
  function closeSheet(){ overlay.classList.remove('show'); }

  const payOverlay = document.getElementById('payOverlay');
  const payCloseBtn = document.getElementById('payCloseBtn');
  const newPayInput = document.getElementById('newPayInput');
  const newPayAddBtn = document.getElementById('newPayAddBtn');

  function openPaySettings(){
    renderPayList();
    payOverlay.classList.add('show');
  }
  function closePaySettings(){ payOverlay.classList.remove('show'); }
  payCloseBtn.onclick = closePaySettings;
  payOverlay.onclick = (e)=>{ if(e.target === payOverlay) closePaySettings(); };

  newPayAddBtn.onclick = async ()=>{
    const v = newPayInput.value.trim();
    if (!v){ showToast('支払い方法を入力してください'); return; }
    if (paymentMethods.includes(v)){ showToast('すでに追加されています'); return; }
    paymentMethods.push(v);
    await savePaymentMethods();
    newPayInput.value = '';
    renderPayList();
    buildPaySelect();
    showToast('追加しました');
  };

  fabBtn.onclick = openSheet;
  cancelBtn.onclick = closeSheet;
  overlay.onclick = (e)=>{ if(e.target === overlay) closeSheet(); };

  addBtn.onclick = async ()=>{
    const date = document.getElementById('inDate').value || todayStr();
    const item = document.getElementById('inItem').value.trim();
    const amount = Number(document.getElementById('inAmount').value);
    const pay = document.getElementById('inPay').value;
    if (!amount || amount <= 0){
      showToast('金額を入力してください');
      return;
    }
    const entryMonth = date.slice(0,7);
    const id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    const newEntry = { id, date, item, amount, pay };

    if (entryMonth === monthKey(current)){
      expenses.push(newEntry);
      await saveExpenses();
      closeSheet();
      render();
      showToast('追加しました');
    } else {
      // belongs to a different month than currently viewed
      try {
        const ex = await storage.get(`expenses:${entryMonth}`);
        const list = ex ? JSON.parse(ex.value) : [];
        list.push(newEntry);
        await storage.set(`expenses:${entryMonth}`, JSON.stringify(list), false);
        closeSheet();
        showToast('追加しました（別の月に保存）');
      } catch(e){
        showToast('保存に失敗しました');
      }
    }
  };

  (async function init(){
    await loadPaymentMethods();
    await loadMonth();
    render();
    fabBtn.style.display = 'flex';
  })();
})();
</script>
</body>
</html>
